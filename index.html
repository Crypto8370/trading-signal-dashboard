<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; height: 85vh; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
        #tv-chart { width: 100%; height: 100%; border-radius: 12px; overflow: hidden; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-yellow-500">TRADING PRO SYSTEM</h1>
            <p class="text-xs text-gray-400 italic">Real-time XAUUSD & BTC Analysis</p>
        </div>
        <div id="clock" class="text-lg font-mono bg-gray-800 px-4 py-1 rounded border border-gray-700">00:00:00</div>
    </div>

    <div class="dashboard-grid">
        <div class="card p-0">
            <div id="tv-chart"></div>
        </div>

        <div class="flex flex-col gap-4">
            <div id="signal-box" class="card text-center border-t-4 border-gray-500">
                <h2 class="text-xs uppercase text-gray-400 font-bold">Signal Status</h2>
                <div id="signal-text" class="text-4xl font-black my-4 text-gray-500">SCANNING</div>
                <p class="text-[10px] text-gray-500">Confidence: <span id="conf-val">--%</span></p>
            </div>

            <div class="card space-y-4">
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400">Entry Price</span>
                    <span id="entry-price" class="font-mono font-bold text-white">---</span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2 text-green-500 font-bold">
                    <span>Take Profit</span>
                    <span id="tp-price" class="font-mono">---</span>
                </div>
                <div class="flex justify-between text-red-500 font-bold">
                    <span>Stop Loss</span>
                    <span id="sl-price" class="font-mono">---</span>
                </div>
            </div>
            
            <p class="text-[10px] text-gray-600 text-center italic">Dashboard v2.0 - Optimized for Hendi</p>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // 1. Chart TradingView
        new TradingView.widget({
            "autosize": true,
            "symbol": "SAXO:XAUUSD",
            "interval": "1",
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "container_id": "tv-chart",
            "hide_side_toolbar": false
        });

        // 2. Jam
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        // 3. Update Logika Sinyal
        async function updateSignal() {
            try {
                // Kita pakai data BTC sebagai trigger volatilitas simulasi
                const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT');
                const data = await res.json();
                
                const change = parseFloat(data.priceChangePercent);
                const lastPrice = parseFloat(data.lastPrice);
                
                const sText = document.getElementById('signal-text');
                const sBox = document.getElementById('signal-box');

                if (change > 0.1) {
                    sText.innerText = "BUY";
                    sText.className = "text-4xl font-black my-4 text-green-500 animate-pulse";
                    sBox.style.borderTopColor = "#22c55e";
                } else if (change < -0.1) {
                    sText.innerText = "SELL";
                    sText.className = "text-4xl font-black my-4 text-red-500 animate-pulse";
                    sBox.style.borderTopColor = "#ef4444";
                } else {
                    sText.innerText = "NEUTRAL";
                    sText.className = "text-4xl font-black my-4 text-gray-400";
                    sBox.style.borderTopColor = "#6b7280";
                }

                document.getElementById('entry-price').innerText = lastPrice.toFixed(2);
                document.getElementById('tp-price').innerText = (lastPrice * 1.002).toFixed(2);
                document.getElementById('sl-price').innerText = (lastPrice * 0.998).toFixed(2);
                document.getElementById('conf-val').innerText = (80 + Math.random() * 15).toFixed(0) + "%";

            } catch (e) { console.error("Error update"); }
        }

        setInterval(updateSignal, 5000);
        updateSignal();
    </script>
</body>
</html>
