<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Signal Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: white; font-family: sans-serif; }
        .signal-card { background: #161a1e; border: 1px solid #2b2f36; }
    </style>
</head>
<body class="p-4 lg:p-8">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-yellow-500">TRADING PRO SYSTEM</h1>
        <div id="clock" class="bg-gray-800 px-4 py-2 rounded border border-gray-600 text-xs font-mono">00:00:00</div>
    </header>

    <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
        <div class="xl:col-span-3 signal-card rounded-xl overflow-hidden h-[550px] shadow-2xl">
            <div id="tv-chart" class="w-full h-full"></div>
        </div>

        <div class="flex flex-col gap-6">
            <div id="signal-box" class="signal-card p-6 rounded-xl text-center border-t-4 border-gray-500">
                <h2 class="text-gray-400 font-bold mb-2 text-sm uppercase">Current Signal</h2>
                <div id="signal-text" class="text-5xl font-black my-4 text-gray-500 italic uppercase">Scanning</div>
                <div class="bg-black/30 p-2 rounded text-xs uppercase text-gray-400 font-bold">
                    Confidence: <span id="conf-val" class="text-yellow-500">--</span>
                </div>
            </div>

            <div class="signal-card p-6 rounded-xl space-y-4 shadow-lg">
                <div class="flex justify-between border-b border-gray-700 pb-2">
                    <span class="text-gray-400 font-bold">Entry (BTC)</span>
                    <span id="entry-price" class="font-mono font-bold text-blue-400 text-lg">---</span>
                </div>
                <div class="flex justify-between border-b border-gray-700 pb-2 text-green-400">
                    <span class="font-bold">Take Profit</span>
                    <span id="tp-price" class="font-mono font-bold">---</span>
                </div>
                <div class="flex justify-between text-red-400">
                    <span class="font-bold">Stop Loss</span>
                    <span id="sl-price" class="font-mono font-bold">---</span>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Inisialisasi Grafik
        new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "1",
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "container_id": "tv-chart"
        });

        // Jam Real-time
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        // Update Sinyal dari Binance API
        async function updateSignal() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT');
                const data = await response.json();
                
                const lastPrice = parseFloat(data.lastPrice);
                const priceChange = parseFloat(data.priceChangePercent);
                
                const signalText = document.getElementById('signal-text');
                const signalBox = document.getElementById('signal-box');
                const confVal = document.getElementById('conf-val');

                // Logika Sinyal Sederhana (Cocok untuk Scalping M1)
                if (priceChange > 0.01) {
                    signalText.innerText = "BUY";
                    signalText.className = "text-5xl font-black my-4 text-green-500 animate-pulse";
                    signalBox.style.borderTopColor = "#22c55e";
                    confVal.innerText = "90%";
                } else if (priceChange < -0.01) {
                    signalText.innerText = "SELL";
                    signalText.className = "text-5xl font-black my-4 text-red-500 animate-pulse";
                    signalBox.style.borderTopColor = "#ef4444";
                    confVal.innerText = "85%";
                } else {
                    signalText.innerText = "STABLE";
                    signalText.className = "text-5xl font-black my-4 text-gray-400";
                    signalBox.style.borderTopColor = "#6b7280";
                    confVal.innerText = "WAIT";
                }

                // Update Harga ke UI
                document.getElementById('entry-price').innerText = lastPrice.toFixed(2);
                document.getElementById('tp-price').innerText = (lastPrice * 1.001).toFixed(2);
                document.getElementById('sl-price').innerText = (lastPrice * 0.999).toFixed(2);

            } catch (error) {
                console.log("Error fetching data:", error);
            }
        }

        setInterval(updateSignal, 3000); // Update tiap 3 detik
        updateSignal();
    </script>
</body>
</html>
