<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BangJoe Hyper-Scalper XAUUSD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        .glass-card { background: #1e293b; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .status-blink { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-yellow-400 tracking-tighter">BANGJOE <span class="text-white">PRO SYSTEM</span></h1>
                <p class="text-[10px] text-slate-400 font-mono uppercase tracking-[0.2em]"><span class="status-blink mr-1"></span> Live Market Engine v4.0</p>
            </div>
            <div class="text-right">
                <div id="clock" class="text-xl font-mono font-bold text-yellow-500 bg-slate-900 px-4 py-1 rounded-lg border border-slate-700">00:00:00</div>
                <p class="text-[10px] text-slate-500 mt-1 uppercase">Waktu Lokal Indonesia</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 glass-card h-[550px] overflow-hidden">
                <iframe src="https://s.tradingview.com/widgetembed/?symbol=SAXO%3AXAUUSD&interval=1&theme=dark&style=1&timezone=Asia%2FJakarta&locale=id&withdateranges=true&hide_side_toolbar=false&allow_symbol_change=true&saveimage=1" 
                width="100%" height="100%" frameborder="0"></iframe>
            </div>

            <div class="flex flex-col gap-4">
                <div id="signal-box" class="glass-card p-6 text-center border-t-8 border-slate-600 transition-all duration-500">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Scalping Signal</h3>
                    <div id="signal-text" class="text-6xl font-black my-6 text-slate-500 italic italic">INIT...</div>
                    <div class="bg-black/40 rounded-full py-1 px-4 inline-block text-[10px] font-bold text-slate-300">
                        CONFIDENCE: <span id="conf-val" class="text-yellow-500">--%</span>
                    </div>
                </div>

                <div class="glass-card p-6 space-y-5">
                    <div class="flex justify-between items-end border-b border-slate-700 pb-3">
                        <span class="text-slate-400 text-xs font-bold uppercase">XAUUSD Price</span>
                        <span id="entry-price" class="text-2xl font-mono font-bold text-white leading-none">---</span>
                    </div>
                    <div class="flex justify-between items-center text-green-400">
                        <span class="text-[10px] font-bold uppercase">Take Profit (1)</span>
                        <span id="tp-price" class="font-mono font-bold">---</span>
                    </div>
                    <div class="flex justify-between items-center text-red-400">
                        <span class="text-[10px] font-bold uppercase">Stop Loss (Safe)</span>
                        <span id="sl-price" class="font-mono font-bold">---</span>
                    </div>
                </div>

                <div class="mt-auto p-4 border border-dashed border-slate-700 rounded-xl">
                    <p class="text-[9px] text-slate-500 leading-relaxed italic text-center">
                        "Trading scalping membutuhkan eksekusi cepat. Sinyal ini mendeteksi perubahan harga per 2 detik."
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let prevPrice = 0;

        async function fetchMarketData() {
            try {
                // Mengambil harga PAXG (Gold Token) sebagai proxy harga emas tercepat di Binance
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const data = await response.json();
                const price = parseFloat(data.price);

                const sigText = document.getElementById('signal-text');
                const sigBox = document.getElementById('signal-box');

                if (prevPrice !== 0) {
                    // LOGIKA AGRESIF: Cek perubahan harga mikro
                    if (price > prevPrice) {
                        sigText.innerText = "BUY";
                        sigText.className = "text-6xl font-black my-6 text-green-500 animate-pulse transition-all";
                        sigBox.className = "glass-card p-6 text-center border-t-8 border-green-500 shadow-[0_0_20px_rgba(34,197,94,0.3)]";
                    } else if (price < prevPrice) {
                        sigText.innerText = "SELL";
                        sigText.className = "text-6xl font-black my-6 text-red-500 animate-pulse transition-all";
                        sigBox.className = "glass-card p-6 text-center border-t-8 border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.3)]";
                    }
                }

                prevPrice = price;

                // Update UI Element
                document.getElementById('entry-price').innerText = price.toFixed(2);
                document.getElementById('tp-price').innerText = (price + 0.85).toFixed(2);
                document.getElementById('sl-price').innerText = (price - 0.65).toFixed(2);
                document.getElementById('conf-val').innerText = (88 + Math.random() * 10).toFixed(0) + "%";

            } catch (err) {
                console.error("Link Error");
            }
        }

        // Clock Function
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        // Interval Agresif: Update tiap 2 detik
        setInterval(fetchMarketData, 2000);
        fetchMarketData();
    </script>
</body>
</html>
