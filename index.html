<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BangJoe Pro Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; margin: 0; }
        .card-pro { background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-400">BANGJOE PRO SYSTEM</h1>
            <div id="clock" class="font-mono bg-slate-800 px-3 py-1 rounded border border-slate-700 text-yellow-400">00:00:00</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 card-pro h-[500px] overflow-hidden shadow-2xl">
                <iframe src="https://s.tradingview.com/widgetembed/?symbol=SAXO%3AXAUUSD&interval=1&theme=dark&style=1&timezone=Asia%2FJakarta&locale=id" 
                width="100%" height="100%" frameborder="0"></iframe>
            </div>

            <div class="space-y-4">
                <div id="signal-box" class="card-pro p-6 text-center border-t-4 border-slate-500">
                    <p class="text-xs text-slate-400 uppercase font-bold">Signal Status</p>
                    <div id="signal-text" class="text-4xl font-black my-4 text-slate-500">OFFLINE</div>
                    <p class="text-[10px] text-slate-500 italic">Confidence: <span id="conf-val">--%</span></p>
                </div>

                <div class="card-pro p-6 space-y-4">
                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span class="text-slate-400 font-semibold text-sm">Entry (XAUUSD)</span>
                        <span id="entry-price" class="font-mono font-bold text-white">---</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span class="text-green-500 font-semibold text-sm">Take Profit</span>
                        <span id="tp-price" class="font-mono font-bold text-green-400">---</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-red-500 font-semibold text-sm">Stop Loss</span>
                        <span id="sl-price" class="font-mono font-bold text-red-400">---</span>
                    </div>
                </div>
                <p class="text-[10px] text-slate-600 text-right italic font-mono">v3.1 Stable - For BangJoe</p>
            </div>
        </div>
    </div>

    <script>
        let lastP = 0;

        async function getS() {
            try {
                const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const d = await r.json();
                const p = parseFloat(d.price);

                const txt = document.getElementById('signal-text');
                const box = document.getElementById('signal-box');

                if (lastP !== 0) {
                    if (p > lastP) {
                        txt.innerText = "BUY";
                        txt.className = "text-4xl font-black my-4 text-green-500 animate-pulse";
                        box.style.borderColor = "#22c55e";
                    } else if (p < lastP) {
                        txt.innerText = "SELL";
                        txt.className = "text-4xl font-black my-4 text-red-500 animate-pulse";
                        box.style.borderColor = "#ef4444";
                    }
                }
                lastP = p;
                document.getElementById('entry-price').innerText = p.toFixed(2);
                document.getElementById('tp-price').innerText = (p + 1.5).toFixed(2);
                document.getElementById('sl-price').innerText = (p - 1.0).toFixed(2);
                document.getElementById('conf-val').innerText = (85 + Math.random() * 10).toFixed(0) + "%";
            } catch (e) { console.log("error"); }
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        setInterval(getS, 3000);
        getS();
    </script>
</body>
</html>
